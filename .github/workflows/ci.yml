name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  merge-ready:
    name: merge-ready
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install configuration validators
        run: bun install --global eslint@9.39.4 oxlint@1.80.0 oxfmt@0.54.0
      - name: Run canonical checks in an isolated process namespace
        # Disk safety tests inspect /proc and must not observe runner service processes.
        run: sudo env "PATH=$PATH" unshare --pid --fork --mount-proc node scripts/check.mjs
